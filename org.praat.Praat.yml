id: org.praat.Praat
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: praat

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=cups
  - --filesystem=home

modules:
  - name: praat
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install PREFIX=${FLATPAK_DEST}
    sources:
      - type: git
        url: https://github.com/praat/praat.github.io
        commit: 4073a568270a40ef86f080079527f795ec7d257b
        tag: v7.0.01
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: patch
        path: update-metainfo.patch
