id: org.praat.Praat
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: praat

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=cups
  - --filesystem=home

modules:
  - name: praat
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install PREFIX=${FLATPAK_DEST}
    sources:
      - type: git
        url: https://github.com/praat/praat.github.io
        commit: 34cf52d6e3156c2dc0e8bc5605709cb66b2cb3c2
        tag: v7.0
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: patch
        path: update-metainfo.patch
